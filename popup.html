<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Filter CN</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        margin: 0;
        min-width: 220px;
        padding: 14px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      a {
        font-size: 13px;
        color: #1d9bf0;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .meta {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.72;
      }
      .meta button {
        appearance: none;
        border: 0;
        padding: 0;
        background: transparent;
        color: #1d9bf0;
        font: inherit;
        cursor: pointer;
      }
      .meta button:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>X Filter CN</h1>
    <label>
      <input type="checkbox" id="enabled" />
      启用过滤
    </label>
    <a href="options.html" id="options" target="_blank">管理规则</a>
    <div class="meta" id="meta"></div>
    <script src="popup.js"></script>
  </body>
</html>
